name: Windows CI

on: [push, pull_request, workflow_dispatch]

jobs:
  msvc-cmake-build:
  
    strategy:
      matrix:
        include:
          - qt_ver: '6.12.0'
            vs: '2022'
            aqt_arch: 'win64_msvc2022_64'
            msvc_arch: 'x64'

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        arch: ${{ matrix.aqt_arch }}
        version: ${{ matrix.qt_ver }}
        modules: 'qtmultimedia'
        cache: true
        aqtsource: 'aqtinstall @ git+https://github.com/miurahr/aqtinstall@16db45a70b5905ad596941b223469bc86a56901e'
    - name: Download FFmpeg and kf6redist
      shell: cmd
      run: |
        curl -fsSL -o ffmpeg-shared.7z https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-full_build-shared.7z
        7z x ffmpeg-shared.7z -y -o"build_dependencies"
        echo FFMPEG_ROOT=%CD%\build_dependencies\ffmpeg-9.0.1-full_build-shared >> %GITHUB_ENV%
        curl -fsSL -o kf6redist.zip https://github.com/BLumia/kf6redist/releases/download/kf6.31.0/win-x64-vs2022-qt6.12.0-kfv6.31.0.zip
        7z x kf6redist.zip -y -o"build_dependencies\kf6redist"
        echo KF6REDIST_DIR=%CD%\build_dependencies\kf6redist >> %GITHUB_ENV%
    - name: Build
      shell: pwsh
      run: |
        ./.github/scripts/build.ps1
        ./.github/scripts/build.ps1 -Deploy
    - uses: actions/upload-artifact@v6
      with:
        name: "${{ matrix.aqt_arch }}-qt${{ matrix.qt_ver }}-pcmarker-cmake-pkg"
        path: install-msvc/bin/*
